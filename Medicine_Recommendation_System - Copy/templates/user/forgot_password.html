<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - AI Medical Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/user.css') }}">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>
<body style="background: #f8f9fa;">
    <div class="container user-container" style="max-width: 450px; margin-top: 80px;">
        <div class="card" style="padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: none; border-top: 5px solid #3498db;">
            <div style="text-align: center; margin-bottom: 25px;">
                <div style="font-size: 3rem; margin-bottom: 10px;">&#128274;</div>
                <h2 class="section-title" style="margin-top:0; color: #2c3e50; font-weight: 800;">Forgot Password</h2>
                <p style="color: #7f8c8d; font-size: 0.95rem;">Enter your email to reset your password</p>
            </div>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="error-msg" style="background: {% if category == 'error' %}#fff5f5{% else %}#f0fdf4{% endif %}; color: {% if category == 'error' %}#c53030{% else %}#166534{% endif %}; padding: 12px; border-radius: 8px; border-left: 4px solid {% if category == 'error' %}#e53e3e{% else %}#16a34a{% endif %}; margin-bottom: 20px; font-weight: 500;">
                    {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('user.forgot_password') }}">
                <div class="form-group" style="margin-bottom: 25px;">
                    <label class="form-label fw-bold" style="color: #4a5568;">Registered Email Address</label>
                    <input type="email" name="email" class="form-control" style="padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; transition: border-color 0.2s;" required autofocus>
                </div>
                <button type="submit" class="btn-submit w-100" style="padding: 12px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; background-color: #3498db; color: white; border: none; transition: background 0.2s; cursor: pointer;">Continue</button>
            </form>
            
            <div class="text-center" style="margin-top: 25px; font-size: 0.95rem; color: #7f8c8d;">
                Remember your password? <a href="{{ url_for('login') }}" style="color: #3498db; text-decoration: none; font-weight: 600;">Login here</a>
            </div>
            <div class="text-center mt-3">
                <a href="/" style="color: #95a5a6; text-decoration: none; font-size: 0.9rem;">&larr; Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
