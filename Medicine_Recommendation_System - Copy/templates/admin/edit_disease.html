<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Disease - AI Medical Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>
<body>
    <div class="container admin-container">
        <!-- Header -->
        <header class="admin-header" style="display: flex; flex-direction: column; gap: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div>
                    <h1 style="margin:0; color:#2c3e50;">&#128104;&#8205;&#9877;&#65039; Edit Disease</h1>
                    <p style="margin:5px 0 0 0; color:#7f8c8d;">Update details for {{ disease.name }}</p>
                </div>
                <div>
                    <a href="{{ url_for('admin.diseases') }}" class="btn-outline" style="margin-right: 10px;">&#8592; Back</a>
                    <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>
                </div>
            </div>
        </header>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div style="padding: 15px; margin-bottom: 20px; border-radius: 4px; {% if category == 'success' %}background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;{% else %}background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="card mt-4" style="background-color: #ffffff; border: 1px solid #e9ecef; padding: 30px;">
            <form action="{{ url_for('admin.edit_disease', disease_id=disease._id) }}" method="POST">
                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 8px; color: #2c3e50;">Disease Name</label>
                    <input type="text" name="name" value="{{ disease.name }}" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 1rem;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 8px; color: #2c3e50;">Description</label>
                    <textarea name="description" rows="3" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 1rem;">{{ disease.description }}</textarea>
                </div>
                
                <div style="margin-bottom: 30px;">
                    <label style="font-weight: bold; display: block; margin-bottom: 8px; color: #2c3e50;">Precautions (Comma-separated)</label>
                    <input type="text" name="precautions" value="{{ ', '.join(disease.precautions) }}" required style="width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 1rem;" placeholder="e.g. bath twice, use detol">
                </div>
                
                <div style="display: flex; gap: 15px;">
                    <button type="submit" style="padding: 12px 25px; background-color: #f39c12; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.05rem;">Save Changes</button>
                    <a href="{{ url_for('admin.diseases') }}" style="padding: 12px 25px; background-color: #95a5a6; color: white; border: none; border-radius: 6px; font-weight: bold; text-decoration: none; font-size: 1.05rem; display: inline-block;">Cancel</a>
                </div>
            </form>
        </div>
    </div>

<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
